<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clippa — Traffic Ground Truth Annotator</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --input-bg: #0f172a;
      --input-border: #475569;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }
    .brand span { color: var(--primary); }
    .container {
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1rem;
      width: 100%;
      flex: 1;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }
    .clip-title {
      font-size: 1.15rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 9999px;
      background-color: var(--card-border);
      color: var(--text-muted);
    }
    .badge-primary { background-color: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .badge-success { background-color: rgba(16, 185, 129, 0.2); color: #34d399; }
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background-color: var(--input-bg);
      border-radius: 9999px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background-color: var(--primary);
      transition: width 0.3s ease;
    }
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
      border-radius: 8px;
      overflow: hidden;
      background-color: #000;
      border: 1px solid var(--card-border);
      margin-bottom: 1.5rem;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .model-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      background-color: rgba(15, 23, 42, 0.6);
      border: 1px dashed var(--card-border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
    }
    .metric-box {
      display: flex;
      flex-direction: column;
    }
    .metric-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
    .metric-value { font-size: 1.25rem; font-weight: 700; color: #38bdf8; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
    input[type="number"], input[type="text"] {
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 1.1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--primary); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background-color: var(--primary);
      color: white;
      transition: background-color 0.2s;
    }
    .btn:hover { background-color: var(--primary-hover); }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-block; }
    .alert {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .alert-danger { background-color: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: #fca5a5; }
    .alert-warning { background-color: rgba(245, 158, 11, 0.2); border: 1px solid var(--warning); color: #fde68a; }
    .completed-state {
      text-align: center;
      padding: 3rem 1rem;
    }
    .completed-icon { font-size: 3rem; margin-bottom: 1rem; }
    .completed-title { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>🚗</span> Clippa
    </div>
    <div>
      <span class="badge badge-primary">Google Sheets & Drive Connected</span>
    </div>
  </header>

  <main class="container">
    {{template "task_card.html" .}}
  </main>
</body>
</html>
