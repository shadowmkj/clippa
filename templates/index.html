<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clippa — Traffic Ground Truth Annotator</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --sidebar-bg: #111827;
      --item-hover: #1e293b;
      --item-selected: #1e3a8a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --input-bg: #0f172a;
      --input-border: #475569;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.2rem;
      font-weight: 700;
    }
    .brand span { color: var(--primary); }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .btn-sm {
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background-color: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }
    .btn-sm:hover {
      background-color: var(--card-border);
      border-color: var(--primary);
    }
    .btn-primary-sm {
      background-color: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    .btn-primary-sm:hover {
      background-color: var(--primary-hover);
    }
    .app-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 57px);
      overflow: hidden;
    }
    .sidebar {
      width: 360px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      transition: width 0.25s ease, opacity 0.25s ease;
      flex-shrink: 0;
      overflow: hidden;
    }
    .sidebar.collapsed {
      width: 0;
      border-right: none;
      opacity: 0;
    }
    .sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid var(--card-border);
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background-color: var(--input-bg);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }
    .progress-bar {
      height: 100%;
      background-color: var(--success);
      transition: width 0.3s ease;
    }
    .filter-group {
      display: flex;
      gap: 0.4rem;
    }
    .filter-btn {
      flex: 1;
      padding: 0.35rem;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid var(--card-border);
      background-color: transparent;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
    }
    .filter-btn.active {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .clip-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .clip-item {
      padding: 0.75rem;
      border-radius: 8px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      transition: all 0.15s;
    }
    .clip-item:hover {
      background-color: var(--item-hover);
      border-color: var(--primary);
    }
    .clip-item.selected {
      background-color: var(--item-selected);
      border-color: #60a5fa;
      box-shadow: 0 0 0 1px #60a5fa;
    }
    .clip-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .clip-name {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }
    .clip-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      font-size: 0.7rem;
      font-weight: 600;
      border-radius: 9999px;
      background-color: var(--card-border);
      color: var(--text-muted);
    }
    .badge-done { background-color: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-pending { background-color: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .editor-container {
      width: 100%;
      max-width: 1000px;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
      border-radius: 8px;
      overflow: hidden;
      background-color: #000;
      border: 1px solid var(--card-border);
      margin-bottom: 1.25rem;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .model-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      background-color: rgba(15, 23, 42, 0.6);
      border: 1px dashed var(--card-border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
    }
    .metric-box { display: flex; flex-direction: column; }
    .metric-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
    .metric-value { font-size: 1.2rem; font-weight: 700; color: #38bdf8; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
    input[type="number"], input[type="text"] {
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 1.1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--primary); }
    .btn-submit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background-color: var(--primary);
      color: white;
      transition: background-color 0.2s;
    }
    .btn-submit:hover { background-color: var(--primary-hover); }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-block; }
    .alert {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .alert-success { background-color: rgba(16, 185, 129, 0.2); border: 1px solid var(--success); color: #34d399; }
    .alert-danger { background-color: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: #fca5a5; }
    .alert-warning { background-color: rgba(245, 158, 11, 0.2); border: 1px solid var(--warning); color: #fde68a; }
  </style>
</head>
<body>
  <header>
    <div style="display: flex; align-items: center; gap: 1rem;">
      <button id="toggle-sidebar-btn" class="btn-sm" onclick="toggleSidebar()" title="Toggle Sidebar (Full Screen)">
        <span>☰</span> Clips
      </button>
      <div class="brand">
        <span>🚗</span> Clippa
      </div>
    </div>

    <div class="header-actions">
      <button class="btn-sm btn-primary-sm" hx-post="/sync-drive" hx-target="body" hx-indicator="#sync-spinner">
        <span>📥</span> Sync Drive <span id="sync-spinner" class="htmx-indicator">⏳</span>
      </button>
      <button class="btn-sm" onclick="window.location.reload()">
        <span>🔄</span> Refresh
      </button>
    </div>
  </header>

  <div class="app-layout">
    <aside id="sidebar-panel" class="sidebar">
      {{template "sidebar.html" .}}
    </aside>

    <main class="main-content">
      <div class="editor-container">
        {{template "task_card.html" .}}
      </div>
    </main>
  </div>

  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar-panel');
      sidebar.classList.toggle('collapsed');
    }

    function filterClips(type) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('filter-' + type);
      if (activeBtn) activeBtn.classList.add('active');

      const items = document.querySelectorAll('.clip-item');
      items.forEach(item => {
        const isDone = item.getAttribute('data-status') === 'done';
        if (type === 'all') {
          item.style.display = 'flex';
        } else if (type === 'done') {
          item.style.display = isDone ? 'flex' : 'none';
        } else if (type === 'pending') {
          item.style.display = !isDone ? 'flex' : 'none';
        }
      });
    }

    // Highlight active clip item when swapped via HTMX
    document.body.addEventListener('htmx:afterSwap', function(evt) {
      if (evt.detail.target.id === 'task-card') {
        const inputRow = evt.detail.target.querySelector('input[name="row_index"]');
        if (inputRow) {
          const rowVal = inputRow.value;
          document.querySelectorAll('.clip-item').forEach(el => el.classList.remove('selected'));
          const selectedEl = document.getElementById('clip-item-' + rowVal);
          if (selectedEl) selectedEl.classList.add('selected');
        }
      }
    });
  </script>
</body>
</html>
