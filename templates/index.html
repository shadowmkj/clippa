<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Clippa — Traffic Ground Truth Annotator</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --sidebar-bg: #111827;
      --item-hover: #1e293b;
      --item-selected: #1e3a8a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --input-bg: #0f172a;
      --input-border: #475569;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 0.65rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .brand span { color: var(--primary); }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-sm {
      padding: 0.45rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background-color: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      min-height: 38px;
      transition: all 0.2s;
      touch-action: manipulation;
    }
    .btn-sm:hover, .btn-sm:active {
      background-color: var(--card-border);
      border-color: var(--primary);
    }
    .btn-primary-sm {
      background-color: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    .btn-primary-sm:hover, .btn-primary-sm:active {
      background-color: var(--primary-hover);
    }
    .app-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 54px);
      height: calc(100dvh - 54px);
      overflow: hidden;
      position: relative;
    }

    /* Desktop Sidebar */
    .sidebar {
      width: 360px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
      flex-shrink: 0;
      overflow: hidden;
      z-index: 200;
    }
    .sidebar.collapsed {
      width: 0;
      border-right: none;
      opacity: 0;
    }
    .sidebar-header {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--card-border);
    }
    .sidebar-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .close-drawer-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
      padding: 0.25rem;
      line-height: 1;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background-color: var(--input-bg);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 0.65rem;
    }
    .progress-bar {
      height: 100%;
      background-color: var(--success);
      transition: width 0.3s ease;
    }
    .filter-group {
      display: flex;
      gap: 0.35rem;
    }
    .filter-btn {
      flex: 1;
      padding: 0.4rem 0.2rem;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid var(--card-border);
      background-color: transparent;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      min-height: 32px;
      touch-action: manipulation;
    }
    .filter-btn.active {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .clip-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .clip-item {
      padding: 0.75rem;
      border-radius: 8px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      transition: background-color 0.15s, border-color 0.15s;
      min-height: 54px;
      touch-action: manipulation;
    }
    .clip-item:hover {
      background-color: var(--item-hover);
      border-color: var(--primary);
    }
    .clip-item.selected {
      background-color: var(--item-selected);
      border-color: #60a5fa;
      box-shadow: 0 0 0 1px #60a5fa;
    }
    .clip-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .clip-name {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 210px;
    }
    .clip-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      font-size: 0.7rem;
      font-weight: 600;
      border-radius: 9999px;
      background-color: var(--card-border);
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .badge-done { background-color: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-pending { background-color: rgba(245, 158, 11, 0.2); color: #fbbf24; }

    /* Main Content */
    .main-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .editor-container {
      width: 100%;
      max-width: 960px;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
      border-radius: 8px;
      overflow: hidden;
      background-color: #000;
      border: 1px solid var(--card-border);
      margin-bottom: 1rem;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .model-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      background-color: rgba(15, 23, 42, 0.6);
      border: 1px dashed var(--card-border);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      margin-bottom: 1rem;
    }
    .metric-box { display: flex; flex-direction: column; }
    .metric-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; }
    .metric-value { font-size: 1.15rem; font-weight: 700; color: #38bdf8; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
    label { font-size: 0.82rem; font-weight: 600; color: var(--text-muted); }
    input[type="number"], input[type="text"] {
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 16px; /* 16px prevents iOS Safari auto-zoom */
      outline: none;
      min-height: 44px;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--primary); }
    .btn-submit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background-color: var(--primary);
      color: white;
      min-height: 48px;
      transition: background-color 0.2s;
      touch-action: manipulation;
    }
    .btn-submit:hover, .btn-submit:active { background-color: var(--primary-hover); }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-block; }
    .alert {
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
      margin-bottom: 0.85rem;
      font-size: 0.85rem;
    }
    .alert-success { background-color: rgba(16, 185, 129, 0.2); border: 1px solid var(--success); color: #34d399; }
    .alert-danger { background-color: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: #fca5a5; }
    .alert-warning { background-color: rgba(245, 158, 11, 0.2); border: 1px solid var(--warning); color: #fde68a; }

    /* Mobile Drawer & Backdrop */
    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .sidebar-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Mobile Responsive Breakpoints */
    @media (max-width: 768px) {
      header {
        padding: 0.5rem 0.85rem;
      }
      .brand {
        font-size: 1.05rem;
      }
      .btn-sm {
        padding: 0.35rem 0.6rem;
        font-size: 0.8rem;
        min-height: 34px;
      }
      .app-layout {
        height: calc(100vh - 49px);
        height: calc(100dvh - 49px);
      }
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        height: 100vh;
        height: 100dvh;
        width: 85vw;
        max-width: 320px;
        transform: translateX(-100%);
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 10px 0 25px rgba(0,0,0,0.6);
        z-index: 200;
        opacity: 1;
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .sidebar.collapsed {
        width: 85vw;
        transform: translateX(-100%);
        opacity: 1;
      }
      .close-drawer-btn {
        display: block;
      }
      .main-content {
        padding: 0.75rem 0.5rem;
      }
      .card {
        padding: 1rem 0.85rem;
        border-radius: 10px;
      }
    }

    @media (max-width: 480px) {
      .form-grid {
        grid-template-columns: 1fr;
        gap: 0.65rem;
      }
      .model-metrics {
        gap: 0.5rem;
        padding: 0.5rem 0.65rem;
      }
      .header-actions .btn-sm span:not(.htmx-indicator) {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div id="sidebar-backdrop" class="sidebar-backdrop" onclick="closeSidebar()"></div>

  <header>
    <div style="display: flex; align-items: center; gap: 0.65rem;">
      <button id="toggle-sidebar-btn" class="btn-sm" onclick="toggleSidebar()" title="Toggle Sidebar">
        <span>☰</span> Clips
      </button>
      <div class="brand">
        <span>🚗</span> Clippa
      </div>
    </div>

    <div class="header-actions">
      <button class="btn-sm btn-primary-sm" hx-post="/sync-drive" hx-target="body" hx-indicator="#sync-spinner">
        <span>📥</span> Sync <span id="sync-spinner" class="htmx-indicator">⏳</span>
      </button>
      <button class="btn-sm" onclick="window.location.reload()">
        <span>🔄</span>
      </button>
    </div>
  </header>

  <div class="app-layout">
    <aside id="sidebar-panel" class="sidebar">
      <div class="sidebar-top-bar" style="display: flex; justify-content: flex-end; padding: 0.5rem 0.75rem 0 0;">
        <button class="close-drawer-btn" onclick="closeSidebar()" title="Close Menu">✕</button>
      </div>
      {{template "sidebar.html" .}}
    </aside>

    <main class="main-content">
      <div class="editor-container">
        {{template "task_card.html" .}}
      </div>
    </main>
  </div>

  <script>
    function isMobile() {
      return window.innerWidth <= 768;
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar-panel');
      const backdrop = document.getElementById('sidebar-backdrop');
      if (isMobile()) {
        const isOpen = sidebar.classList.toggle('open');
        backdrop.classList.toggle('active', isOpen);
      } else {
        sidebar.classList.toggle('collapsed');
      }
    }

    function closeSidebar() {
      const sidebar = document.getElementById('sidebar-panel');
      const backdrop = document.getElementById('sidebar-backdrop');
      sidebar.classList.remove('open');
      backdrop.classList.remove('active');
    }

    function filterClips(type) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('filter-' + type);
      if (activeBtn) activeBtn.classList.add('active');

      const items = document.querySelectorAll('.clip-item');
      items.forEach(item => {
        const isDone = item.getAttribute('data-status') === 'done';
        if (type === 'all') {
          item.style.display = 'flex';
        } else if (type === 'done') {
          item.style.display = isDone ? 'flex' : 'none';
        } else if (type === 'pending') {
          item.style.display = !isDone ? 'flex' : 'none';
        }
      });
    }

    // Auto-close mobile drawer when a clip is selected, and highlight active item
    document.body.addEventListener('htmx:afterSwap', function(evt) {
      if (evt.detail.target.id === 'task-card') {
        if (isMobile()) {
          closeSidebar();
        }
        const inputRow = evt.detail.target.querySelector('input[name="row_index"]');
        if (inputRow) {
          const rowVal = inputRow.value;
          document.querySelectorAll('.clip-item').forEach(el => el.classList.remove('selected'));
          const selectedEl = document.getElementById('clip-item-' + rowVal);
          if (selectedEl) selectedEl.classList.add('selected');
        }
      }
    });
  </script>
</body>
</html>
