# ==============================================================================
# Nginx Reverse Proxy Configuration for Clippa
# ==============================================================================

# Upstream definition for Clippa Go server
upstream clippa_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# HTTP -> HTTPS Redirect (Uncomment when SSL is enabled)
# ------------------------------------------------------------------------------
# server {
#     listen 80;
#     listen [::]:80;
#     server_name clippa.example.com;
#     return 301 https://$host$request_uri;
# }

# ------------------------------------------------------------------------------
# Main Server Block
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;

    server_name clippa.example.com; # Replace with your domain or IP

    # SSL Certificates (Uncomment and configure when SSL is active)
    # ssl_certificate /etc/letsencrypt/live/clippa.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/clippa.example.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;

    # Maximum upload/request size
    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy: allows Google Drive video iframe embedding
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline'; frame-src 'self' https://drive.google.com; img-src 'self' data: https:;" always;

    # Logging
    access_log /var/log/nginx/clippa_access.log;
    error_log /var/log/nginx/clippa_error.log warn;

    # Main Application Proxy
    location / {
        proxy_pass http://clippa_backend;

        # Standard Proxy Headers (Crucial for HTMX & Security)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # HTTP/1.1 & WebSocket / Upgrade Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering settings optimized for fast partial HTMX updates
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
    }

    # Health Check Endpoint (Bypass detailed logging if desired)
    location = /healthz {
        proxy_pass http://clippa_backend;
        access_log off;
    }
}
