services:
  clippa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clippa
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./credentials.json:/app/credentials.json:ro
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
